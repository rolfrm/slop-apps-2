<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="borderGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <style>
    .rim { stroke: #67e8f9; fill: none; }
    .hand { stroke: #e2e8f0; }
    .dot { fill: #38bdf8; }
    @media (prefers-color-scheme: light) {
      .rim { stroke: #0e7490; }
      .hand { stroke: #1e293b; }
      .dot { fill: #0284c7; }
    }
  </style>
  <rect x="4" y="4" width="48" height="48" rx="10" fill="none" stroke="url(#borderGradient)" stroke-width="2"/>
  <!-- Clock face -->
  <circle class="rim" cx="28" cy="26" r="13" stroke-width="2"/>
  <!-- Hour hand -->
  <line class="hand" x1="28" y1="26" x2="28" y2="16" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line class="hand" x1="28" y1="26" x2="36" y2="26" stroke-width="2" stroke-linecap="round"/>
  <!-- Center dot -->
  <circle class="dot" cx="28" cy="26" r="2"/>
  <!-- Globe dots -->
  <circle class="dot" cx="14" cy="18" r="1.2" opacity="0.5"/>
  <circle class="dot" cx="40" cy="34" r="1.2" opacity="0.5"/>
  <circle class="dot" cx="38" cy="16" r="1" opacity="0.4"/>
</svg>
