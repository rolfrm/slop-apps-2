<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>
  <style>
    .target { fill: #ef4444; stroke: #fca5a5; }
    .cross { stroke: #fca5a5; }
    @media (prefers-color-scheme: light) {
      .target { fill: #dc2626; stroke: #991b1b; }
      .cross { stroke: #991b1b; }
    }
  </style>
  <rect x="4" y="4" width="48" height="48" rx="8" fill="none" stroke="url(#bg)" stroke-width="2"/>
  <!-- Crosshair -->
  <line class="cross" x1="28" y1="14" x2="28" y2="22" stroke-width="2.5" stroke-linecap="round"/>
  <line class="cross" x1="28" y1="34" x2="28" y2="42" stroke-width="2.5" stroke-linecap="round"/>
  <line class="cross" x1="14" y1="28" x2="22" y2="28" stroke-width="2.5" stroke-linecap="round"/>
  <line class="cross" x1="34" y1="28" x2="42" y2="28" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="28" r="3" fill="none" class="cross" stroke-width="2"/>
  <!-- Target -->
  <circle class="target" cx="40" cy="16" r="6" stroke-width="2"/>
  <circle class="target" cx="40" cy="16" r="3" stroke-width="1.5"/>
  <circle class="target" cx="40" cy="16" r="1" fill="none" stroke-width="1"/>
</svg>
