<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>FPS Prototype</title>
  <script src="/slop-os.js"></script>
  <link rel="stylesheet" href="/styles.css">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #0a0a0f;
      font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    #gameCanvas {
      display: block;
      position: fixed;
      inset: 0;
    }

    /* ---- HUD ---- */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    /* Crosshair */
    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #crosshair svg {
      width: 28px;
      height: 28px;
      transition: transform 0.08s ease-out;
    }
    #crosshair svg.firing {
      transform: scale(1.8);
    }
    .ch-line {
      stroke: rgba(255,255,255,0.85);
      stroke-width: 2;
      stroke-linecap: round;
    }
    .ch-dot {
      fill: none;
      stroke: rgba(255,80,80,0.9);
      stroke-width: 1.5;
    }

    /* Bottom bar */
    #bottombar {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 32px;
      background: rgba(8,8,16,0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 12px 28px;
    }
    .hud-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .hud-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: rgba(255,255,255,0.45);
    }
    .hud-value {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      line-height: 1;
    }
    .hud-value.ammo-low { color: #f87171; animation: pulse 0.6s infinite alternate; }
    @keyframes pulse { to { opacity: 0.5; } }

    /* Damage flash */
    #damage-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(255,0,0,0.35) 100%);
      opacity: 0;
      transition: opacity 0.1s ease-out;
      pointer-events: none;
      z-index: 9;
    }

    /* Hit marker */
    #hitmarker {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 0.15s;
      font-size: 18px;
      color: #ff4444;
      font-weight: bold;
    }

    /* Message */
    #message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) translateY(60px);
      color: rgba(255,255,255,0.85);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    /* Minimap */
    #minimap {
      position: absolute;
      bottom: 120px;
      right: 24px;
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.15);
      background: rgba(8,8,16,0.65);
      overflow: hidden;
    }
    #minimap canvas {
      width: 100%;
      height: 100%;
    }

    /* Instructions */
    #instructions {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.85);
      font-size: 14px;
      text-align: center;
      line-height: 1.8;
      opacity: 1;
      transition: opacity 0.5s;
    }
    #instructions.hidden { opacity: 0; }
    #instructions kbd {
      display: inline-block;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 5px;
      padding: 2px 8px;
      font-family: inherit;
      font-size: 13px;
      margin: 0 2px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div id="crosshair">
      <svg viewBox="0 0 28 28" id="crosshairSvg">
        <line class="ch-line" x1="14" y1="2"  x2="14" y2="9"/>
        <line class="ch-line" x1="14" y1="19" x2="14" y2="26"/>
        <line class="ch-line" x1="2"  y1="14" x2="9"  y2="14"/>
        <line class="ch-line" x1="19" y1="14" x2="26" y2="14"/>
        <circle class="ch-dot" cx="14" cy="14" r="2.5"/>
      </svg>
    </div>

    <div id="hitmarker">✕</div>

    <div id="bottombar">
      <div class="hud-item">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="scoreVal">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Ammo</span>
        <span class="hud-value" id="ammoVal">30 / ∞</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">Targets</span>
        <span class="hud-value" id="targetsVal">0</span>
      </div>
      <div class="hud-item">
        <span class="hud-label">HP</span>
        <span class="hud-value" id="healthVal">100</span>
      </div>
    </div>

    <div id="instructions">
      <kbd>Click</kbd> to play &nbsp;·&nbsp;
      <kbd>W A S D</kbd> move &nbsp;·&nbsp;
      <kbd>Shift</kbd> sprint &nbsp;·&nbsp;
      <kbd>Space</kbd> jump<br>
      <kbd>Mouse</kbd> aim &nbsp;·&nbsp;
      <kbd>Left Click</kbd> shoot &nbsp;·&nbsp;
      <kbd>R</kbd> reload
    </div>

    <div id="message"></div>
  </div>

  <div id="damage-flash"></div>

  <div id="minimap"><canvas id="minimapCanvas" width="100" height="100"></canvas></div>
</body>
</html>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────
// DOM refs
// ─────────────────────────────────────
const canvas = document.getElementById('gameCanvas');
const crosshairSvg = document.getElementById('crosshairSvg');
const hitMarker = document.getElementById('hitmarker');
const damageFlash = document.getElementById('damage-flash');
const messageEl = document.getElementById('message');
const instructions = document.getElementById('instructions');
const ammoVal = document.getElementById('ammoVal');
const scoreVal = document.getElementById('scoreVal');
const targetsVal = document.getElementById('targetsVal');
const healthVal = document.getElementById('healthVal');
const minimapCanvas = document.getElementById('minimapCanvas');
const minimapCtx = minimapCanvas.getContext('2d');

// ─────────────────────────────────────
// Three.js setup
// ─────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#1a1a2e');
scene.fog = new THREE.Fog('#1a1a2e', 30, 120);

const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.15, 200);
camera.position.set(0, 1.7, 0);

// ─────────────────────────────────────
// Lighting
// ─────────────────────────────────────
const ambient = new THREE.AmbientLight('#4466aa', 0.6);
scene.add(ambient);

const sun = new THREE.DirectionalLight('#ffe8d0', 1.8);
sun.position.set(20, 30, 10);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 120;
sun.shadow.camera.left = -40;
sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;
sun.shadow.camera.bottom = -40;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const hemi = new THREE.HemisphereLight('#8899cc', '#334455', 0.4);
scene.add(hemi);

// ─────────────────────────────────────
// Ground
// ─────────────────────────────────────
const groundGeom = new THREE.PlaneGeometry(100, 100);
const groundMat = new THREE.MeshStandardMaterial({
  color: '#2a2a38',
  roughness: 0.85,
  metalness: 0.1
});
const ground = new THREE.Mesh(groundGeom, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Grid lines on ground
const gridHelper = new THREE.PolarGridHelper(48, 48, 24, 128, '#3a3a4a', '#2e2e3c');
gridHelper.position.y = 0.01;
scene.add(gridHelper);

// ─────────────────────────────────────
// Walls / Arena boundary
// ─────────────────────────────────────
function createWall(w, h, d, x, y, z) {
  const geom = new THREE.BoxGeometry(w, h, d);
  const mat = new THREE.MeshStandardMaterial({ color: '#3d3d50', roughness: 0.7, metalness: 0.2 });
  const wall = new THREE.Mesh(geom, mat);
  wall.position.set(x, y, z);
  wall.castShadow = true;
  wall.receiveShadow = true;
  scene.add(wall);
  return wall;
}
const WALL_H = 4;
const WALL_T = 0.6;
const ARENA_R = 45;
createWall(ARENA_R * 2 + WALL_T, WALL_H, WALL_T, 0, WALL_H / 2, -ARENA_R);
createWall(ARENA_R * 2 + WALL_T, WALL_H, WALL_T, 0, WALL_H / 2, ARENA_R);
createWall(WALL_T, WALL_H, ARENA_R * 2, -ARENA_R, WALL_H / 2, 0);
createWall(WALL_T, WALL_H, ARENA_R * 2, ARENA_R, WALL_H / 2, 0);

// ─────────────────────────────────────
// Pillars / cover
// ─────────────────────────────────────
const pillars = [];
for (let i = 0; i < 12; i++) {
  const angle = (i / 12) * Math.PI * 2 + 0.3;
  const dist = 18 + Math.random() * 22;
  const px = Math.cos(angle) * dist;
  const pz = Math.sin(angle) * dist;
  const w = 1 + Math.random() * 2;
  const h = 2 + Math.random() * 3;
  const geom = new THREE.BoxGeometry(w, h, w);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.65 + Math.random() * 0.1, 0.05, 0.25 + Math.random() * 0.15),
    roughness: 0.6,
    metalness: 0.3
  });
  const pillar = new THREE.Mesh(geom, mat);
  pillar.position.set(px, h / 2, pz);
  pillar.castShadow = true;
  pillar.receiveShadow = true;
  scene.add(pillar);
  pillars.push({ mesh: pillar, x: px, z: pz, w, d: w });
}

// ─────────────────────────────────────
// Decorative crates
// ─────────────────────────────────────
const crates = [];
for (let i = 0; i < 20; i++) {
  const angle = Math.random() * Math.PI * 2;
  const dist = 5 + Math.random() * 38;
  const cx = Math.cos(angle) * dist;
  const cz = Math.sin(angle) * dist;
  const s = 0.5 + Math.random() * 1.5;
  const geom = new THREE.BoxGeometry(s, s, s);
  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(0.1, 0.15, 0.2 + Math.random() * 0.2),
    roughness: 0.5,
    metalness: 0.4
  });
  const crate = new THREE.Mesh(geom, mat);
  crate.position.set(cx, s / 2, cz);
  crate.rotation.y = Math.random() * Math.PI;
  crate.castShadow = true;
  crate.receiveShadow = true;
  scene.add(crate);
  crates.push(crate);
}

// ─────────────────────────────────────
// Target system
// ─────────────────────────────────────
const targets = [];
const targetGeom = new THREE.SphereGeometry(0.5, 16, 12);
const targetMaterials = [
  new THREE.MeshStandardMaterial({ color: '#ef4444', roughness: 0.3, metalness: 0.2, emissive: '#330000', emissiveIntensity: 0.4 }),
  new THREE.MeshStandardMaterial({ color: '#f97316', roughness: 0.3, metalness: 0.2, emissive: '#331100', emissiveIntensity: 0.4 }),
  new THREE.MeshStandardMaterial({ color: '#eab308', roughness: 0.3, metalness: 0.2, emissive: '#332200', emissiveIntensity: 0.4 }),
];

function spawnTarget() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 8 + Math.random() * 35;
  const tx = Math.cos(angle) * dist;
  const tz = Math.sin(angle) * dist;

  const mat = targetMaterials[Math.floor(Math.random() * targetMaterials.length)].clone();
  const mesh = new THREE.Mesh(targetGeom, mat);
  mesh.position.set(tx, 1.2 + Math.random() * 2.5, tz);
  mesh.castShadow = true;
  mesh.receiveShadow = true;

  // Ring indicator
  const ringGeom = new THREE.TorusGeometry(0.55, 0.06, 8, 16);
  const ring = new THREE.Mesh(ringGeom, new THREE.MeshBasicMaterial({ color: mat.color, transparent: true, opacity: 0.5 }));
  ring.rotation.x = -Math.PI / 2;
  mesh.add(ring);

  scene.add(mesh);

  const targetData = {
    mesh,
    ring,
    hp: 1,
    baseY: mesh.position.y,
    bobPhase: Math.random() * Math.PI * 2,
    bobSpeed: 0.8 + Math.random() * 1.2,
    bobAmp: 0.15 + Math.random() * 0.3,
    moveAngle: Math.random() * Math.PI * 2,
    moveSpeed: 0.3 + Math.random() * 0.7,
    moveRadius: 0.5 + Math.random() * 2,
    spawnTime: performance.now(),
  };
  targets.push(targetData);
  return targetData;
}

// Spawn initial targets
const MAX_TARGETS = 15;
for (let i = 0; i < 8; i++) spawnTarget();

// ─────────────────────────────────────
// Particles
// ─────────────────────────────────────
const particles = [];
const particleGeom = new THREE.SphereGeometry(0.06, 4, 4);

// ─────────────────────────────────────
// Rockets
// ─────────────────────────────────────
const rockets = [];
const rocketGeom = new THREE.ConeGeometry(0.15, 0.5, 6, 4);
rocketGeom.rotateX(-Math.PI / 2); // point along +Z

function spawnParticles(position, color, count = 18) {
  for (let i = 0; i < count; i++) {
    const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1 });
    const p = new THREE.Mesh(particleGeom, mat);
    p.position.copy(position);
    const speed = 3 + Math.random() * 8;
    const dir = new THREE.Vector3(
      (Math.random() - 0.5) * 2,
      Math.random() * 1.5,
      (Math.random() - 0.5) * 2
    ).normalize();
    p.userData = { velocity: dir.multiplyScalar(speed), life: 0.5 + Math.random() * 0.8, age: 0 };
    scene.add(p);
    particles.push(p);
  }
}

function spawnRocket(origin, direction) {
  const mat = new THREE.MeshStandardMaterial({
    color: '#ff4444',
    roughness: 0.2,
    metalness: 0.3,
    emissive: '#ff2200',
    emissiveIntensity: 1.2
  });
  const mesh = new THREE.Mesh(rocketGeom, mat);
  mesh.position.copy(origin);
  // Orient cone tip toward player
  mesh.lookAt(origin.clone().add(direction));
  mesh.castShadow = true;
  scene.add(mesh);

  // Glow sphere
  const glowGeom = new THREE.SphereGeometry(0.18, 8, 8);
  const glowMat = new THREE.MeshBasicMaterial({ color: '#ff6644', transparent: true, opacity: 0.7 });
  const glow = new THREE.Mesh(glowGeom, glowMat);
  mesh.add(glow);

  rockets.push({
    mesh,
    glow,
    direction: direction.clone(),
    speed: 7 + Math.random() * 5,
    life: 6,
    age: 0,
  });
}

// ─────────────────────────────────────
// Muzzle flash
// ─────────────────────────────────────
const muzzleGeom = new THREE.SphereGeometry(0.08, 8, 8);
const muzzleMat = new THREE.MeshBasicMaterial({ color: '#ffaa44', transparent: true, opacity: 0 });
const muzzleFlash = new THREE.Mesh(muzzleGeom, muzzleMat);
muzzleFlash.renderOrder = 999;
muzzleFlash.material.depthTest = false;
muzzleFlash.material.depthWrite = false;
camera.add(muzzleFlash);
muzzleFlash.position.set(0.2, -0.15, -0.5);
scene.add(camera);

// ─────────────────────────────────────
// Player state
// ─────────────────────────────────────
const player = {
  position: new THREE.Vector3(0, 1.7, 0),
  velocity: new THREE.Vector3(),
  yaw: 0,
  pitch: 0,
  onGround: true,
  ammo: 30,
  maxAmmo: 30,
  reloading: false,
  reloadTime: 1.5,
  reloadStart: 0,
  score: 0,
  health: 100,
  sprinting: false,
  bobTimer: 0,
  bobAmount: 0,
};

const keys = {};
const GRAVITY = 18;
const MOVE_SPEED = 8;
const SPRINT_MULT = 1.6;
const JUMP_VEL = 7;
const MOUSE_SENS = 0.002;

// ─────────────────────────────────────
// Pointer lock
// ─────────────────────────────────────
let locked = false;
canvas.addEventListener('click', () => {
  if (!locked) {
    canvas.requestPointerLock();
  }
});

document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === canvas;
  if (locked) {
    instructions.classList.add('hidden');
    showMessage('');
  } else {
    instructions.classList.remove('hidden');
  }
});

document.addEventListener('mousemove', (e) => {
  if (!locked) return;
  player.yaw -= e.movementX * MOUSE_SENS;
  player.pitch -= e.movementY * MOUSE_SENS;
  player.pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, player.pitch));
});

// ─────────────────────────────────────
// Keyboard
// ─────────────────────────────────────
window.addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.code === 'KeyR' && !player.reloading && player.ammo < player.maxAmmo) {
    startReload();
  }
});
window.addEventListener('keyup', (e) => { keys[e.code] = false; });

function startReload() {
  player.reloading = true;
  player.reloadStart = performance.now() / 1000;
}

// ─────────────────────────────────────
// Shooting
// ─────────────────────────────────────
const raycaster = new THREE.Raycaster();
raycaster.far = 80;

function shoot() {
  if (player.reloading || player.ammo <= 0) {
    if (player.ammo <= 0 && !player.reloading) startReload();
    return;
  }

  player.ammo--;

  // Muzzle flash
  muzzleFlash.material.opacity = 1;
  muzzleFlash.scale.setScalar(1 + Math.random() * 0.5);

  // Recoil
  player.pitch += 0.008 + Math.random() * 0.006;
  player.yaw += (Math.random() - 0.5) * 0.004;

  // Crosshair animation
  crosshairSvg.classList.add('firing');
  setTimeout(() => crosshairSvg.classList.remove('firing'), 80);

  // Raycast from camera center
  raycaster.set(camera.getWorldPosition(new THREE.Vector3()), camera.getWorldDirection(new THREE.Vector3()));

  // Collect all target meshes
  const targetMeshes = targets.map(t => t.mesh);
  const pillarMeshes = pillars.map(p => p.mesh);
  const allShootable = [...targetMeshes, ...pillarMeshes, ...crates, ground];

  const hits = raycaster.intersectObjects(allShootable, false);

  if (hits.length > 0) {
    const hit = hits[0];
    const point = hit.point;

    // Spark particles at impact
    spawnParticles(point, '#ffcc88', 6);

    // Check if we hit a target
    const targetIndex = targets.findIndex(t => t.mesh === hit.object);
    if (targetIndex !== -1) {
      const target = targets[targetIndex];
      target.hp--;

      // Hit marker
      hitMarker.style.opacity = '1';
      setTimeout(() => { hitMarker.style.opacity = '0'; }, 120);

      if (target.hp <= 0) {
        // Destroy target
        spawnParticles(target.mesh.position, '#' + target.mesh.material.color.getHexString(), 24);
        scene.remove(target.mesh);
        targets.splice(targetIndex, 1);

        player.score += 100;
        showMessage('+100', 800);

        // Respawn after delay
        setTimeout(() => {
          if (targets.length < MAX_TARGETS) spawnTarget();
        }, 1500 + Math.random() * 2000);
      } else {
        spawnParticles(point, '#ffaa00', 10);
      }
    } else {
      // Hit wall/pillar/ground - sparks
      spawnParticles(point, '#cccccc', 5);
    }
  }

  updateHUD();
}

window.addEventListener('mousedown', (e) => {
  if (!locked || e.button !== 0) return;
  shoot();
});

// ─────────────────────────────────────
// Message toast
// ─────────────────────────────────────
let messageTimeout;
function showMessage(text, duration = 1500) {
  if (messageTimeout) clearTimeout(messageTimeout);
  messageEl.textContent = text;
  messageEl.style.opacity = text ? '1' : '0';
  if (text && duration) {
    messageTimeout = setTimeout(() => {
      messageEl.style.opacity = '0';
    }, duration);
  }
}

// ─────────────────────────────────────
// HUD update
// ─────────────────────────────────────
function updateHUD() {
  scoreVal.textContent = player.score;
  const ammoClass = player.ammo <= 8 ? 'hud-value ammo-low' : 'hud-value';
  ammoVal.innerHTML = `<span class="${ammoClass}">${player.ammo}</span> / ∞`;
  targetsVal.textContent = targets.length;

  // Health
  const hpClass = player.health <= 30 ? 'hud-value ammo-low' : 'hud-value';
  healthVal.innerHTML = `<span class="${hpClass}">${Math.max(0, player.health)}</span>`;

  if (player.reloading) {
    const elapsed = (performance.now() / 1000) - player.reloadStart;
    const progress = Math.min(elapsed / player.reloadTime, 1);
    ammoVal.innerHTML = `<span style="color:#fbbf24">Reloading ${Math.round(progress * 100)}%</span>`;
  }
}

// ─────────────────────────────────────
// Collision detection (pillars + walls)
// ─────────────────────────────────────
function checkCollision(pos) {
  const r = 0.4; // player radius

  // Walls
  if (Math.abs(pos.x) > ARENA_R - r) pos.x = Math.sign(pos.x) * (ARENA_R - r);
  if (Math.abs(pos.z) > ARENA_R - r) pos.z = Math.sign(pos.z) * (ARENA_R - r);

  // Pillars
  for (const p of pillars) {
    const dx = pos.x - p.x;
    const dz = pos.z - p.z;
    const minDist = p.w / 2 + r;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < minDist && dist > 0.001) {
      const nx = dx / dist;
      const nz = dz / dist;
      pos.x = p.x + nx * minDist;
      pos.z = p.z + nz * minDist;
    }
  }

  // Crates
  for (const c of crates) {
    const dx = pos.x - c.position.x;
    const dz = pos.z - c.position.z;
    const minDist = (c.geometry.parameters.width || 1) / 2 + r;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < minDist && dist > 0.001) {
      const nx = dx / dist;
      const nz = dz / dist;
      pos.x = c.position.x + nx * minDist;
      pos.z = c.position.z + nz * minDist;
    }
  }
}

// ─────────────────────────────────────
// Game loop
// ─────────────────────────────────────
const clock = new THREE.Clock();
let lastShotTime = 0;
const SHOOT_COOLDOWN = 0.12;

function update(delta) {
  delta = Math.min(delta, 0.1);

  // ── Reload ──
  if (player.reloading) {
    const elapsed = (performance.now() / 1000) - player.reloadStart;
    if (elapsed >= player.reloadTime) {
      player.ammo = player.maxAmmo;
      player.reloading = false;
    }
    updateHUD();
  }

  // ── Movement ──
  if (locked) {
    const sprinting = keys['ShiftLeft'] || keys['ShiftRight'];
    player.sprinting = sprinting;
    const speed = MOVE_SPEED * (sprinting ? SPRINT_MULT : 1);

    const forward = new THREE.Vector3(Math.sin(player.yaw), 0, Math.cos(player.yaw)).normalize();
    const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw)).normalize();

    let moveX = 0, moveZ = 0;
    if (keys['KeyW']) { moveX += forward.x; moveZ += forward.z; }
    if (keys['KeyS']) { moveX -= forward.x; moveZ -= forward.z; }
    if (keys['KeyA']) { moveX += right.x; moveZ += right.z; }
    if (keys['KeyD']) { moveX -= right.x; moveZ -= right.z; }

    const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
    if (len > 0) {
      moveX /= len;
      moveZ /= len;
    }

    player.velocity.x = moveX * speed;
    player.velocity.z = moveZ * speed;

    // Jump
    if (keys['Space'] && player.onGround) {
      player.velocity.y = JUMP_VEL;
      player.onGround = false;
    }
  } else {
    player.velocity.x *= 0.9;
    player.velocity.z *= 0.9;
  }

  // Gravity
  player.velocity.y -= GRAVITY * delta;

  // Integrate
  player.position.x += player.velocity.x * delta;
  player.position.y += player.velocity.y * delta;
  player.position.z += player.velocity.z * delta;

  // Ground collision
  if (player.position.y <= 1.7) {
    player.position.y = 1.7;
    player.velocity.y = 0;
    player.onGround = true;
  }

  // Wall/pillar collision
  checkCollision(player.position);

  // ── Camera bob ──
  const isMoving = Math.abs(player.velocity.x) > 0.2 || Math.abs(player.velocity.z) > 0.2;
  if (isMoving && player.onGround) {
    const bobSpeed = player.sprinting ? 12 : 8;
    player.bobTimer += delta * bobSpeed;
    const bobTarget = player.sprinting ? 0.06 : 0.035;
    player.bobAmount += (bobTarget - player.bobAmount) * 10 * delta;
  } else {
    player.bobAmount += (0 - player.bobAmount) * 8 * delta;
    if (player.bobAmount > 0.001) player.bobTimer += delta * 3;
  }

  const bobX = Math.sin(player.bobTimer) * player.bobAmount;
  const bobY = Math.abs(Math.cos(player.bobTimer * 2)) * player.bobAmount * 0.5;

  // Update camera
  camera.position.set(
    player.position.x + bobX,
    player.position.y + bobY,
    player.position.z
  );

  const lookDir = new THREE.Vector3(
    Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    Math.cos(player.yaw) * Math.cos(player.pitch)
  );
  camera.lookAt(camera.position.clone().add(lookDir));

  // ── Update targets ──
  const now = performance.now() / 1000;
  for (const t of targets) {
    // Bobbing
    t.mesh.position.y = t.baseY + Math.sin(now * t.bobSpeed + t.bobPhase) * t.bobAmp;

    // Slow drift
    t.moveAngle += (Math.random() - 0.5) * 0.02;
    const driftX = Math.cos(t.moveAngle) * t.moveSpeed * delta;
    const driftZ = Math.sin(t.moveAngle) * t.moveSpeed * delta;
    t.mesh.position.x += driftX;
    t.mesh.position.z += driftZ;

    // Keep in arena
    t.mesh.position.x = THREE.MathUtils.clamp(t.mesh.position.x, -ARENA_R + 1, ARENA_R - 1);
    t.mesh.position.z = THREE.MathUtils.clamp(t.mesh.position.z, -ARENA_R + 1, ARENA_R - 1);

    // Slow rotation
    t.mesh.rotation.y += delta * 0.5;

    // Chance to fire rocket at player
    if (Math.random() < delta * 0.25 && rockets.length < 8) {
      const tpos = t.mesh.position.clone();
      const toPlayer = player.position.clone().sub(tpos).normalize();
      spawnRocket(tpos, toPlayer);
    }
  }

  // Spawn more targets if needed
  if (targets.length < 5 && Math.random() < delta * 1.5) {
    spawnTarget();
  }

  // ── Update particles ──
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.age += delta;
    const progress = p.userData.age / p.userData.life;
    p.material.opacity = 1 - progress;
    p.position.add(p.userData.velocity.clone().multiplyScalar(delta));
    p.userData.velocity.y += 3 * delta;
    p.scale.setScalar(1 - progress * 0.7);
    if (progress >= 1) {
      scene.remove(p);
      p.material.dispose();
      particles.splice(i, 1);
    }
  }

  // ── Update rockets ──
  for (let i = rockets.length - 1; i >= 0; i--) {
    const r = rockets[i];
    r.age += delta;

    // Move rocket
    const move = r.direction.clone().multiplyScalar(r.speed * delta);
    r.mesh.position.add(move);

    // Trail particles
    if (Math.random() < delta * 30) {
      spawnParticles(r.mesh.position.clone(), '#ff8844', 2);
    }

    // Check collision with player
    const distToPlayer = r.mesh.position.distanceTo(player.position);
    if (distToPlayer < 1.0) {
      // Rocket hit player
      spawnParticles(r.mesh.position.clone(), '#ff4422', 30);
      player.health -= 20;
      // Damage flash
      damageFlash.style.opacity = '1';
      damageFlash.style.transition = 'opacity 0.08s ease-out';
      setTimeout(() => {
        damageFlash.style.opacity = '0';
        damageFlash.style.transition = 'opacity 0.4s ease-out';
      }, 80);
      showMessage('-20 HP', 800);

      // Check death
      if (player.health <= 0) {
        player.health = 0;
        showMessage('💀 YOU DIED — Respawning...', 2000);
        setTimeout(() => {
          player.health = 100;
          player.position.set(0, 1.7, 0);
          player.velocity.set(0, 0, 0);
          player.score = Math.max(0, player.score - 200);
          showMessage('');
        }, 2000);
      }

      // Screen shake
      player.pitch += (Math.random() - 0.5) * 0.08;
      player.yaw += (Math.random() - 0.5) * 0.08;

      // Remove rocket
      scene.remove(r.mesh);
      r.mesh.material.dispose();
      r.glow.material.dispose();
      rockets.splice(i, 1);
      continue;
    }

    // Check if out of bounds or too old
    const pos = r.mesh.position;
    if (r.age > r.life ||
        Math.abs(pos.x) > ARENA_R + 5 ||
        Math.abs(pos.z) > ARENA_R + 5 ||
        pos.y < 0 || pos.y > 10) {
      spawnParticles(r.mesh.position.clone(), '#ff8844', 8);
      scene.remove(r.mesh);
      r.mesh.material.dispose();
      r.glow.material.dispose();
      rockets.splice(i, 1);
    }
  }

  // ── Muzzle flash fade ──
  muzzleFlash.material.opacity *= 0.85;
  if (muzzleFlash.material.opacity < 0.01) muzzleFlash.material.opacity = 0;

  // ── Update HUD periodically ──
  updateHUD();
}

function render() {
  renderer.render(scene, camera);

  // Minimap
  minimapCtx.clearRect(0, 0, 100, 100);
  minimapCtx.fillStyle = 'rgba(8,8,16,0.7)';
  minimapCtx.beginPath();
  minimapCtx.arc(50, 50, 48, 0, Math.PI * 2);
  minimapCtx.fill();

  // Draw targets on minimap
  const mmScale = 48 / ARENA_R;
  for (const t of targets) {
    const rx = 50 + (t.mesh.position.x - player.position.x) * mmScale;
    const ry = 50 + (t.mesh.position.z - player.position.z) * mmScale;
    const dist = Math.sqrt((rx-50)**2 + (ry-50)**2);
    if (dist < 48) {
      minimapCtx.fillStyle = '#ef4444';
      minimapCtx.beginPath();
      minimapCtx.arc(rx, ry, 2.5, 0, Math.PI * 2);
      minimapCtx.fill();
    }
  }

  // Rocket dots on minimap
  for (const r of rockets) {
    const rx = 50 + (r.mesh.position.x - player.position.x) * mmScale;
    const ry = 50 + (r.mesh.position.z - player.position.z) * mmScale;
    const rdist = Math.sqrt((rx-50)**2 + (ry-50)**2);
    if (rdist < 48) {
      minimapCtx.fillStyle = '#ff8844';
      minimapCtx.beginPath();
      minimapCtx.arc(rx, ry, 2, 0, Math.PI * 2);
      minimapCtx.fill();
    }
  }

  // Player dot
  minimapCtx.fillStyle = '#fff';
  minimapCtx.beginPath();
  minimapCtx.arc(50, 50, 3, 0, Math.PI * 2);
  minimapCtx.fill();

  // Direction indicator
  const dirX = 50 - Math.sin(player.yaw) * 8;
  const dirY = 50 - Math.cos(player.yaw) * 8;
  minimapCtx.strokeStyle = '#fff';
  minimapCtx.lineWidth = 1.5;
  minimapCtx.beginPath();
  minimapCtx.moveTo(50, 50);
  minimapCtx.lineTo(dirX, dirY);
  minimapCtx.stroke();
}

function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  update(delta);
  render();
}

// ─────────────────────────────────────
// Resize
// ─────────────────────────────────────
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

// ─────────────────────────────────────
// Start
// ─────────────────────────────────────
updateHUD();
animate();

console.log('🔫 FPS Prototype ready — click to play');
</script>
