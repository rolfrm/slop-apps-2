<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="./icon.svg">
  <title>Chess</title>
  <script src="/slop-os.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    * { box-sizing: border-box; }
    :root[data-mode="dark"] {
      --sl-wallpaper: radial-gradient(circle at top left, rgba(56,189,248,0.12), transparent 34%),
        linear-gradient(180deg, #0a1320 0%, #060b12 100%);
    }
    :root[data-mode="light"] {
      --sl-wallpaper: radial-gradient(circle at top left, color-mix(in srgb, var(--sl-accent,#1f6bd0) 10%, transparent), transparent 34%),
        var(--sl-surface, #f5f8fc);
    }
    body {
      margin: 0; min-height: 100vh; padding: 20px 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      color: var(--sl-text, #e0e8f0);
      display: flex; justify-content: center;
    }
    .app { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; justify-content: center; max-width: 900px; width: 100%; }
    .board-section { flex-shrink: 0; }
    .side-panel { flex: 1; min-width: 220px; max-width: 300px; display: flex; flex-direction: column; gap: 16px; }

    .board-wrap {
      padding: 12px; border-radius: var(--sl-radius, 14px);
      background: var(--sl-raised, rgba(15,23,42,0.76));
      border: 1px solid var(--sl-border-soft, rgba(148,163,184,0.12));
      display: inline-block;
    }
    .coords-row { display: flex; padding: 0 4px; justify-content: space-around; font-size: 11px; color: var(--sl-text-muted, #94a3b8); margin: 2px 0; }
    .coords-col { display: flex; flex-direction: column; justify-content: space-around; font-size: 11px; color: var(--sl-text-muted, #94a3b8); padding: 0 3px; }
    .board-outer { display: flex; align-items: stretch; }

    .board-grid {
      display: grid;
      grid-template-columns: repeat(8, 60px);
      grid-template-rows: repeat(8, 60px);
      border-radius: 4px; overflow: hidden;
      border: 2px solid var(--sl-border, rgba(125,211,252,0.2));
    }
    @media (max-width: 600px) {
      .board-grid { grid-template-columns: repeat(8, 11vw); grid-template-rows: repeat(8, 11vw); }
    }

    .sq {
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; position: relative; user-select: none;
      font-size: 48px; line-height: 1;
    }
    @media (max-width: 600px) { .sq { font-size: 8.5vw; } }

    .sq-light { background: #e8dcc8; }
    .sq-dark  { background: #b08860; }
    .sq.selected { box-shadow: inset 0 0 0 3px #38bdf8; }
    .sq.last-move { box-shadow: inset 0 0 0 2px rgba(251,191,36,0.7); }
    .sq .dot { width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.2); position: absolute; pointer-events: none; }
    .sq .capture-dot { width: 100%; height: 100%; border-radius: 50%; border: 4px solid rgba(0,0,0,0.2); position: absolute; pointer-events: none; box-sizing: border-box; }
    .sq .check-indicator { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(239,68,68,0.7) 0%, rgba(239,68,68,0.2) 50%, transparent 70%); pointer-events: none; animation: chkPulse 0.8s ease-in-out infinite alternate; }
    @keyframes chkPulse { from { opacity: 0.6; } to { opacity: 1; } }
    .piece-white { color: #f8f9fa; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
    .piece-black { color: #1a1a2e; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

    .panel { padding: 16px; border-radius: var(--sl-radius, 14px); background: var(--sl-raised, rgba(15,23,42,0.76)); border: 1px solid var(--sl-border-soft, rgba(148,163,184,0.12)); }
    .panel h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; color: var(--sl-text-muted, #94a3b8); text-transform: uppercase; letter-spacing: 0.05em; }
    .status-text { font-size: 16px; font-weight: 600; color: var(--sl-accent, #38bdf8); }
    .status-text.gameover { color: var(--sl-warning, #fbbf24); }
    .captured-row { display: flex; flex-wrap: wrap; gap: 2px; font-size: 20px; min-height: 28px; }
    .move-list { max-height: 200px; overflow-y: auto; font-size: 13px; font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace; line-height: 1.7; }
    .move-list .move-num { color: var(--sl-text-muted, #94a3b8); margin-right: 6px; }
    .move-list .move-pair { color: var(--sl-text, #e0e8f0); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--sl-border, rgba(125,211,252,0.2)); background: var(--sl-raised, rgba(15,23,42,0.76)); color: var(--sl-text, #e0e8f0); font-size: 13px; cursor: pointer; font-weight: 500; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
    .btn:hover { background: var(--sl-raised-hover, rgba(30,41,59,0.9)); border-color: var(--sl-accent, #38bdf8); }
    .btn.primary { background: var(--sl-accent, #38bdf8); border-color: var(--sl-accent, #38bdf8); color: #0a1320; font-weight: 600; }
    .btn.primary:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
<div class="app">
  <div class="board-section">
    <div class="board-wrap">
      <div class="coords-row" id="colLabels"></div>
      <div class="board-outer">
        <div class="coords-col" id="rowLabels"></div>
        <div class="board-grid" id="board"></div>
        <div class="coords-col" id="rowLabelsR"></div>
      </div>
      <div class="coords-row" id="colLabelsB"></div>
    </div>
  </div>
  <div class="side-panel">
    <div class="panel"><h3>Status</h3><div class="status-text" id="status">Loading…</div></div>
    <div class="panel"><h3>Captured</h3><div class="captured-row" id="capW"></div><div class="captured-row" id="capB" style="margin-top:4px"></div></div>
    <div class="panel"><h3>Moves</h3><div class="move-list" id="moveList"></div></div>
    <div class="btn-row">
      <button class="btn primary" id="btnNew">New Game</button>
      <button class="btn" id="btnUndo">Undo</button>
      <button class="btn" id="btnFlip">Flip Board</button>
    </div>
  </div>
</div>

<script>var exports={};</script>
<script src="lib/chess.js"></script>
<script>
(function(){
var ChessCtor = exports.Chess;
if (!ChessCtor) { document.getElementById('status').textContent = 'Error: Chess engine failed to load'; return; }

var PIECES = { k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟', K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙' };
var PIECE_VALUES = { p:100, n:320, b:330, r:500, q:900, k:20000 };

// Reconstruct board array since chess.js v0.10 doesn't have .board()
function getBoard(chess) {
  var b = [];
  for (var r = 0; r < 8; r++) {
    b[r] = [];
    for (var f = 0; f < 8; f++) {
      b[r][f] = chess.get('abcdefgh'[f] + (8 - r));
    }
  }
  return b;
}

// Piece-square tables (simplified)
var PST = {
  p: [0,0,0,0,0,0,0,0, 50,50,50,50,50,50,50,50, 10,10,20,30,30,20,10,10, 5,5,10,25,25,10,5,5, 0,0,0,20,20,0,0,0, 5,-5,-10,0,0,-10,-5,5, 5,10,10,-20,-20,10,10,5, 0,0,0,0,0,0,0,0],
  n: [-50,-40,-30,-30,-30,-30,-40,-50, -40,-20,0,0,0,0,-20,-40, -30,0,10,15,15,10,0,-30, -30,5,15,20,20,15,5,-30, -30,0,15,20,20,15,0,-30, -30,5,10,15,15,10,5,-30, -40,-20,0,5,5,0,-20,-40, -50,-40,-30,-30,-30,-30,-40,-50],
  b: [-20,-10,-10,-10,-10,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,10,10,10,10,0,-10, -10,5,5,10,10,5,5,-10, -10,0,5,10,10,5,0,-10, -10,10,5,10,10,5,10,-10, -10,5,0,0,0,0,5,-10, -20,-10,-10,-10,-10,-10,-10,-20],
  r: [0,0,0,0,0,0,0,0, 5,10,10,10,10,10,10,5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, -5,0,0,0,0,0,0,-5, 0,0,0,5,5,0,0,0],
  q: [-20,-10,-10,-5,-5,-10,-10,-20, -10,0,0,0,0,0,0,-10, -10,0,5,5,5,5,0,-10, -5,0,5,5,5,5,0,-5, 0,0,5,5,5,5,0,-5, -10,5,5,5,5,5,0,-10, -10,0,5,0,0,0,0,-10, -20,-10,-10,-5,-5,-10,-10,-20],
  k: [-30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -30,-40,-40,-50,-50,-40,-40,-30, -20,-30,-30,-40,-40,-30,-30,-20, -10,-20,-20,-20,-20,-20,-20,-10, 20,20,0,0,0,0,20,20, 20,30,10,0,0,10,30,20],
  ke: [-50,-40,-30,-20,-20,-30,-40,-50, -30,-20,-10,0,0,-10,-20,-30, -30,-10,20,30,30,20,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,30,40,40,30,-10,-30, -30,-10,20,30,30,20,-10,-30, -30,-30,0,0,0,0,-30,-30, -50,-30,-30,-30,-30,-30,-30,-50]
};

var game, selSquare, legalMoves, lastFrom, lastTo, flipped, aiThinking, aiDepth;
var boardEl, statusEl, moveListEl, capWEl, capBEl;

function resetState() {
  game = new ChessCtor();
  selSquare = null;
  legalMoves = [];
  lastFrom = null;
  lastTo = null;
  flipped = false;
  aiThinking = false;
  aiDepth = 3;
}

function init() {
  boardEl = document.getElementById('board');
  statusEl = document.getElementById('status');
  moveListEl = document.getElementById('moveList');
  capWEl = document.getElementById('capW');
  capBEl = document.getElementById('capB');
  resetState();
  renderAll();
}

function buildLabels() {
  var files = ['a','b','c','d','e','f','g','h'];
  var ranks = ['8','7','6','5','4','3','2','1'];
  var fwd = flipped ? files.slice().reverse() : files;
  var rwd = flipped ? ranks.slice().reverse() : ranks;
  document.getElementById('colLabels').innerHTML = fwd.map(function(f){return '<span>'+f+'</span>';}).join('');
  document.getElementById('colLabelsB').innerHTML = fwd.map(function(f){return '<span>'+f+'</span>';}).join('');
  document.getElementById('rowLabels').innerHTML = rwd.map(function(r){return '<span>'+r+'</span>';}).join('');
  document.getElementById('rowLabelsR').innerHTML = rwd.map(function(r){return '<span>'+r+'</span>';}).join('');
}

function renderBoard() {
  boardEl.innerHTML = '';
  var board = getBoard(game);
  for (var rank = 0; rank < 8; rank++) {
    for (var file = 0; file < 8; file++) {
      var r = flipped ? 7 - rank : rank;
      var f = flipped ? 7 - file : file;
      var sqName = 'abcdefgh'[f] + (8 - r);
      var piece = board[r][f];
      var isLight = (r + f) % 2 === 0;

      var sqEl = document.createElement('div');
      sqEl.className = 'sq ' + (isLight ? 'sq-light' : 'sq-dark');
      sqEl.setAttribute('data-square', sqName);

      if (sqName === selSquare) sqEl.classList.add('selected');
      if (sqName === lastFrom || sqName === lastTo) sqEl.classList.add('last-move');

      if (piece) {
        sqEl.textContent = PIECES[piece.color === 'w' ? piece.type.toUpperCase() : piece.type];
        sqEl.classList.add(piece.color === 'w' ? 'piece-white' : 'piece-black');
      }

      // Legal move dots
      for (var m = 0; m < legalMoves.length; m++) {
        if (legalMoves[m].to === sqName) {
          var dot = document.createElement('div');
          dot.className = piece ? 'capture-dot' : 'dot';
          sqEl.appendChild(dot);
          break;
        }
      }

      // Check indicator
      if (piece && piece.type === 'k' && game.in_check()) {
        if (piece.color === game.turn()) {
          var chk = document.createElement('div');
          chk.className = 'check-indicator';
          sqEl.appendChild(chk);
        }
      }

      (function(sq){ sqEl.addEventListener('click', function(){ onSquareClick(sq); }); })(sqName);
      boardEl.appendChild(sqEl);
    }
  }
}

function renderAll() {
  buildLabels();
  renderBoard();
  updateStatus();
  updateCaptured();
  updateMoveList();
}

function updateStatus() {
  if (game.in_checkmate()) {
    var winner = game.turn() === 'w' ? 'Black' : 'White';
    statusEl.textContent = 'Checkmate! ' + winner + ' wins';
    statusEl.className = 'status-text gameover';
  } else if (game.in_stalemate()) {
    statusEl.textContent = 'Stalemate — Draw';
    statusEl.className = 'status-text gameover';
  } else if (game.in_draw()) {
    var reason = 'Draw';
    if (game.in_threefold_repetition()) reason = 'Threefold repetition';
    if (game.insufficient_material()) reason = 'Insufficient material';
    statusEl.textContent = reason + ' — Draw';
    statusEl.className = 'status-text gameover';
  } else if (game.in_check()) {
    var who = game.turn() === 'w' ? 'White' : 'Black';
    statusEl.textContent = who + ' is in check';
    statusEl.className = 'status-text';
  } else {
    var who2 = game.turn() === 'w' ? 'White' : 'Black';
    statusEl.textContent = aiThinking ? who2 + ' thinking\u2026' : who2 + '\'s turn';
    statusEl.className = 'status-text';
  }
}

function updateCaptured() {
  var history = game.history({ verbose: true });
  var wCap = [], bCap = [];
  for (var i = 0; i < history.length; i++) {
    if (history[i].captured) {
      if (history[i].color === 'w') wCap.push(history[i].captured);
      else bCap.push(history[i].captured);
    }
  }
  wCap.sort(function(a,b){ return (PIECE_VALUES[b]||0) - (PIECE_VALUES[a]||0); });
  bCap.sort(function(a,b){ return (PIECE_VALUES[b]||0) - (PIECE_VALUES[a]||0); });
  capWEl.innerHTML = wCap.map(function(p){ return PIECES[p]; }).join(' ') || '<span style="color:var(--sl-text-muted);font-size:13px">none</span>';
  capBEl.innerHTML = bCap.map(function(p){ return PIECES[p.toUpperCase()]; }).join(' ') || '<span style="color:var(--sl-text-muted);font-size:13px">none</span>';
}

function updateMoveList() {
  var history = game.history({ verbose: true });
  if (!history.length) { moveListEl.innerHTML = '<span style="color:var(--sl-text-muted)">No moves yet</span>'; return; }
  var html = '';
  for (var i = 0; i < history.length; i++) {
    if (i % 2 === 0) html += '<span class="move-num">' + (Math.floor(i/2)+1) + '.</span>';
    html += '<span class="move-pair">' + history[i].san + '</span> ';
  }
  moveListEl.innerHTML = html;
  moveListEl.scrollTop = moveListEl.scrollHeight;
}

function onSquareClick(sq) {
  if (aiThinking) return;
  if (game.game_over()) return;

  var piece = game.get(sq);

  // If we have a selection and clicking a legal target
  if (selSquare) {
    for (var i = 0; i < legalMoves.length; i++) {
      if (legalMoves[i].to === sq) {
        var move = legalMoves[i];
        var promo = (move.flags.indexOf('p') !== -1) ? 'q' : undefined;
        game.move({ from: selSquare, to: sq, promotion: promo });
        lastFrom = selSquare;
        lastTo = sq;
        selSquare = null;
        legalMoves = [];
        renderAll();
        if (!game.game_over() && game.turn() === 'b') {
          setTimeout(aiMove, 150);
        }
        return;
      }
    }
  }

  // Select a piece of current turn's color
  if (piece && piece.color === game.turn()) {
    selSquare = sq;
    var moves = game.moves({ square: sq, verbose: true });
    legalMoves = moves.map(function(m){ return { to: m.to, flags: m.flags }; });
    renderBoard();
    return;
  }

  // Deselect
  selSquare = null;
  legalMoves = [];
  renderBoard();
}

// ─── AI ─────────────────────────────────

function evaluate(chess) {
  if (chess.in_checkmate()) return chess.turn() === 'w' ? -99999 : 99999;
  if (chess.in_draw() || chess.in_stalemate()) return 0;
  var board = getBoard(chess);
  var score = 0, totalMat = 0;
  for (var r = 0; r < 8; r++) {
    for (var f = 0; f < 8; f++) {
      var piece = board[r][f];
      if (!piece) continue;
      var val = PIECE_VALUES[piece.type];
      totalMat += val;
      var idx = piece.color === 'w' ? r * 8 + f : (7 - r) * 8 + (7 - f);
      var sign = piece.color === 'w' ? 1 : -1;
      score += sign * val;
      if (piece.type === 'k' && totalMat < 2800) {
        score += sign * PST.ke[idx];
      } else if (PST[piece.type]) {
        score += sign * PST[piece.type][idx];
      }
    }
  }
  var mobility = chess.moves({ verbose: true }).length;
  var turnSign = chess.turn() === 'w' ? 1 : -1;
  score += turnSign * mobility * 2;
  return score;
}

function orderMoves(chess, moves) {
  return moves.sort(function(a, b){
    var aCap = a.captured ? PIECE_VALUES[a.captured] : 0;
    var bCap = b.captured ? PIECE_VALUES[b.captured] : 0;
    if (aCap !== bCap) return bCap - aCap;
    var aMVLVA = (a.captured ? PIECE_VALUES[a.captured] : 0) - PIECE_VALUES[a.piece];
    var bMVLVA = (b.captured ? PIECE_VALUES[b.captured] : 0) - PIECE_VALUES[b.piece];
    if (aMVLVA !== bMVLVA) return bMVLVA - aMVLVA;
    return (b.flags.indexOf('p')!==-1 ? 1 : 0) - (a.flags.indexOf('p')!==-1 ? 1 : 0);
  });
}

function alphaBeta(chess, depth, alpha, beta, maximizing) {
  if (depth === 0 || chess.game_over()) return evaluate(chess);
  var moves = chess.moves({ verbose: true });
  moves = orderMoves(chess, moves);
  if (maximizing) {
    var maxEval = -Infinity;
    for (var i = 0; i < moves.length; i++) {
      chess.move(moves[i]);
      var val = alphaBeta(chess, depth-1, alpha, beta, false);
      chess.undo();
      maxEval = Math.max(maxEval, val);
      alpha = Math.max(alpha, val);
      if (beta <= alpha) break;
    }
    return maxEval;
  } else {
    var minEval = Infinity;
    for (var i = 0; i < moves.length; i++) {
      chess.move(moves[i]);
      var val = alphaBeta(chess, depth-1, alpha, beta, true);
      chess.undo();
      minEval = Math.min(minEval, val);
      beta = Math.min(beta, val);
      if (beta <= alpha) break;
    }
    return minEval;
  }
}

function findBestMove(chess, depth) {
  var moves = chess.moves({ verbose: true });
  if (!moves.length) return null;
  moves = orderMoves(chess, moves);
  var bestMove = moves[0];
  var bestScore = -Infinity;
  var isMax = chess.turn() === 'w';
  for (var i = 0; i < moves.length; i++) {
    chess.move(moves[i]);
    var score = alphaBeta(chess, depth-1, -Infinity, Infinity, !isMax);
    chess.undo();
    if ((isMax && score > bestScore) || (!isMax && score < bestScore)) {
      bestScore = score; bestMove = moves[i];
    } else if (score === bestScore && Math.random() < 0.3) {
      bestMove = moves[i];
    }
  }
  return bestMove;
}

function aiMove() {
  aiThinking = true;
  updateStatus();
  renderBoard();
  setTimeout(function(){
    var move = findBestMove(game, aiDepth);
    if (move) {
      game.move(move);
      lastFrom = move.from;
      lastTo = move.to;
    }
    selSquare = null;
    legalMoves = [];
    aiThinking = false;
    renderAll();
  }, 50);
}

// ─── Controls ───────────────────────────

function newGame() { resetState(); renderAll(); }

function undoMove() {
  if (aiThinking) return;
  if (game.history().length >= 2) { game.undo(); game.undo(); }
  else if (game.history().length >= 1) { game.undo(); }
  selSquare = null; legalMoves = [];
  var hist = game.history({ verbose: true });
  if (hist.length) { lastFrom = hist[hist.length-1].from; lastTo = hist[hist.length-1].to; }
  else { lastFrom = null; lastTo = null; }
  aiThinking = false;
  renderAll();
}

function flipBoard() { flipped = !flipped; renderAll(); }

document.getElementById('btnNew').addEventListener('click', newGame);
document.getElementById('btnUndo').addEventListener('click', undoMove);
document.getElementById('btnFlip').addEventListener('click', flipBoard);

document.addEventListener('keydown', function(e){
  if (e.target !== document.body) return;
  if (e.key === 'f' && !e.ctrlKey && !e.metaKey) flipBoard();
  if (e.key === 'u' && !e.ctrlKey && !e.metaKey) undoMove();
  if (e.key === 'n' && !e.ctrlKey && !e.metaKey) newGame();
});

if (window.SlopOS) window.SlopOS.on('themechange', renderAll);

init();
})();
</script>
</body>
</html>
